name: Build Signed AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Project & Copy Code
        run: |
          flutter create --org com.profitcalc --project-name profit_discount_calc temp_project
          cp lib/main.dart temp_project/lib/main.dart
          sed -i 's/android:label="profit_discount_calc"/android:label="حاسبة الأرباح والخصومات"/g' temp_project/android/app/src/main/AndroidManifest.xml

      - name: Generate Upload Keystore & Configure Signing
        run: |
          keytool -genkey -v -keystore temp_project/android/app/upload-keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 -alias upload \
            -storepass profit123456 -keypass profit123456 \
            -dname "CN=Merchant Tools, OU=Dev, O=MerchantTools, L=Cairo, S=Cairo, C=EG"

          cat <<EOF > temp_project/android/key.properties
          storePassword=profit123456
          keyPassword=profit123456
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

          if [ -f temp_project/android/app/build.gradle.kts ]; then
            cat <<'EOF' > temp_project/android/app/build.gradle.kts
          import java.util.Properties
          import java.io.FileInputStream

          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          android {
              namespace = "com.profitcalc.profit_discount_calc"
              compileSdk = flutter.compileSdkVersion
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = JavaVersion.VERSION_17.toString()
              }

              defaultConfig {
                  applicationId = "com.profitcalc.profit_discount_calc"
                  minSdk = flutter.minSdkVersion
                  targetSdk = flutter.targetSdkVersion
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }

              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties.getProperty("keyAlias")
                      keyPassword = keystoreProperties.getProperty("keyPassword")
                      storeFile = file(keystoreProperties.getProperty("storeFile"))
                      storePassword = keystoreProperties.getProperty("storePassword")
                  }
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }

          flutter {
              source = "../.."
          }
          EOF
          fi

      - name: Build App Bundle (AAB)
        working-directory: temp_project
        run: flutter build appbundle --release

      - name: Upload AAB and Keystore
        uses: actions/upload-artifact@v4
        with:
          name: profit-calc-release
          path: |
            temp_project/build/app/outputs/bundle/release/app-release.aab
            temp_project/android/app/upload-keystore.jks
